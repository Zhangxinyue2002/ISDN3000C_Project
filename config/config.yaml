# System Configuration

camera:
  resolution: [1280, 720]
  framerate: 30
  capture_interval: 2  # Seconds between automatic captures
  rotation: 0
  flip_horizontal: false
  flip_vertical: false
  capture_mode: "continuous"  # Continuous photo capture
  capture_interval: 2  # Seconds between captures

gpio:
  button_call_999: 11  # Physical Pin 11 (GPIO17) - Button 1: Call emergency
  button_stop_call: 13  # Physical Pin 13 (GPIO27) - Button 2: Stop/cancel
  led_fall: 31         # Physical Pin 31 (GPIO6) - Fall indicator LED
  led_emergency: 33    # Physical Pin 33 (PWM0) - Emergency status LED
  bounce_time: 200     # milliseconds

fall_detection:
  model_path: "models/fall_detection.pt"
  confidence_threshold: 0.75
  check_interval: 0.1  # seconds between frames
  enabled: true
  use_bpu: true  # Use RDK X5 BPU for acceleration if available

breathing_detection:
  capture_duration: 12  # seconds to capture video
  fps: 30  # frames per second
  min_breathing_rate: 12  # breaths per minute (lower bound)
  max_breathing_rate: 20  # breaths per minute (upper bound)
  min_motion_amplitude: 2.0  # pixels (minimum chest movement)
  min_keypoints: 10  # minimum SIFT keypoints needed
  enabled: true
  
  # For testing/tuning (optional):
  # To allow faster breathing rates in test environments:
  # max_breathing_rate: 25
  # To be more sensitive to small movements:
  # min_motion_amplitude: 1.5

emergency:
  countdown_duration: 10  # seconds (LED2 flashes during this time)
  fall_duration_threshold: 120  # seconds (2 minutes) - triggers countdown after fall persists
  contact_number: "999"
  enable_actual_call: false  # Set true for production
  manual_trigger: true  # Allow manual emergency via Button 1 (LED2 solid immediately, no flash)
  auto_trigger: true  # Allow automatic trigger from fall detection (LED2 flashes before solid)
  notification_methods:
    - "log"
    - "web_alert"
  
  # LED Behavior:
  # LED1 (Fall Indicator): ON when fall detected, OFF when normal
  # LED2 (Emergency Status):
  #   - FLASHING: Countdown active (10s) - press Button 2 to cancel
  #   - SOLID: Emergency call active (calling 999)
  #   - OFF: Normal operation
  #
  # Button Behavior:
  # Button 1: Manual emergency - LED2 goes SOLID immediately (no flashing)
  # Button 2: Cancel/Stop - turns both LEDs OFF
    # - "sms"  # Uncomment when configured
    # - "call"  # Uncomment when configured

storage:
  images_directory: "data/images"
  database_path: "data/database.db"
  max_images: 5000  # Maximum images before cleanup
  auto_cleanup: true
  cleanup_strategy: "fifo"  # First-In-First-Out
  cleanup_threshold: 0.85  # Start cleanup at 85% of max_images
  keep_fall_images: true  # Always preserve fall detection images
  keep_emergency_images: true  # Always preserve emergency event images
  cleanup_days: 7  # Delete normal images older than 7 days
  image_quality: 85
  image_format: "jpg"
  disk_space_threshold: 0.90  # Cleanup if disk usage > 90%

network:
  wifi_ssid: "ElderlyMonitor-RDK"
  wifi_password: "elderly2024"
  wifi_channel: 6
  mdns_name: "elderlysystem"
  flask_host: "0.0.0.0"
  flask_port: 5000
  flask_debug: false

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_file: "data/logs/system.log"
  max_log_size: 10485760  # 10 MB
  backup_count: 5
