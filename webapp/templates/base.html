<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Elderly Fall Detection System{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-heart-pulse"></i> Elderly Care Monitor
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                            <i class="bi bi-images"></i> Gallery
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/status' %}active{% endif %}" href="/status">
                            <i class="bi bi-activity"></i> Status
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <main class="container-fluid py-4">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Error/Info Modal -->
    <div class="modal fade" id="messageModal" tabindex="-1" aria-labelledby="messageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header" id="messageModalHeader">
                    <h5 class="modal-title" id="messageModalLabel">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        <span id="messageModalTitle">Information</span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="messageModalBody">
                    <!-- Message content will be inserted here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Confirmation Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="confirmModalLabel">
                        <i class="bi bi-question-circle-fill me-2"></i>
                        <span id="confirmModalTitle">Confirm Action</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="confirmModalBody">
                    <!-- Confirmation message will be inserted here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="confirmModalAction">Confirm</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <footer class="bg-light text-center py-3 mt-5">
        <div class="container">
            <p class="text-muted mb-0">
                Elderly Fall Detection System &copy; 2025 | ISDN3000C Project
            </p>
        </div>
    </footer>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jQuery (for convenience) -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    
    <!-- Global Modal Functions -->
    <script>
        /**
         * Show error message in modal
         */
        function showError(message, title = 'Error') {
            const modal = new bootstrap.Modal(document.getElementById('messageModal'));
            const header = document.getElementById('messageModalHeader');
            const titleElement = document.getElementById('messageModalTitle');
            const body = document.getElementById('messageModalBody');
            
            // Set error styling - only triangle icon
            header.className = 'modal-header bg-danger text-white';
            titleElement.innerHTML = title;  // No icon in title
            body.innerHTML = '<p class="mb-0"><i class="bi bi-exclamation-triangle-fill me-2"></i>' + message + '</p>';
            
            modal.show();
        }
        
        /**
         * Show info message in modal
         */
        function showInfo(message, title = 'Information') {
            const modal = new bootstrap.Modal(document.getElementById('messageModal'));
            const header = document.getElementById('messageModalHeader');
            const titleElement = document.getElementById('messageModalTitle');
            const body = document.getElementById('messageModalBody');
            
            // Set info styling
            header.className = 'modal-header bg-info text-white';
            titleElement.innerHTML = '<i class="bi bi-info-circle-fill me-2"></i>' + title;
            body.innerHTML = '<p class="mb-0">' + message + '</p>';
            
            modal.show();
        }
        
        /**
         * Show success message in modal
         */
        function showSuccess(message, title = 'Success') {
            const modal = new bootstrap.Modal(document.getElementById('messageModal'));
            const header = document.getElementById('messageModalHeader');
            const titleElement = document.getElementById('messageModalTitle');
            const body = document.getElementById('messageModalBody');
            
            // Set success styling
            header.className = 'modal-header bg-success text-white';
            titleElement.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i>' + title;
            body.innerHTML = '<p class="mb-0">' + message + '</p>';
            
            modal.show();
        }
        
        /**
         * Show warning message in modal
         */
        function showWarning(message, title = 'Warning') {
            const modal = new bootstrap.Modal(document.getElementById('messageModal'));
            const header = document.getElementById('messageModalHeader');
            const titleElement = document.getElementById('messageModalTitle');
            const body = document.getElementById('messageModalBody');
            
            // Set warning styling - only triangle icon
            header.className = 'modal-header bg-warning text-dark';
            titleElement.innerHTML = title;  // No icon in title
            body.innerHTML = '<p class="mb-0"><i class="bi bi-exclamation-triangle-fill me-2"></i>' + message + '</p>';
            
            modal.show();
        }
        
        /**
         * Show confirmation dialog
         */
        function showConfirm(message, title, onConfirm) {
            const modal = new bootstrap.Modal(document.getElementById('confirmModal'));
            const titleElement = document.getElementById('confirmModalTitle');
            const body = document.getElementById('confirmModalBody');
            const confirmBtn = document.getElementById('confirmModalAction');
            
            titleElement.textContent = title;
            body.innerHTML = '<p class="mb-0">' + message + '</p>';
            
            // Remove old event listeners
            const newConfirmBtn = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
            
            // Add new event listener
            document.getElementById('confirmModalAction').addEventListener('click', function() {
                modal.hide();
                if (onConfirm) onConfirm();
            });
            
            modal.show();
        }
    </script>
    
    <!-- Custom JS -->
    {% block extra_scripts %}{% endblock %}
</body>
</html>
